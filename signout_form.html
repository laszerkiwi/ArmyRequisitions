<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equipment Requisition Form</title>
    <style>
        :root {
            --bg: #f3f6fb;
            --panel: #ffffff;
            --text: #1f2937;
            --muted: #5d6b7a;
            --primary: #1d4ed8;
            --primary-dark: #163ea8;
            --border: #dfe6ee;
            --error: #b42318;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            width: min(100%, 700px);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            padding: 28px 30px;
        }

        h2 {
            margin: 0 0 22px;
            text-align: center;
            font-size: 2rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 700;
            margin-bottom: 6px;
        }

        input, select, button {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
        }

        input:focus, select:focus {
            outline: 2px solid rgba(29, 78, 216, 0.2);
            border-color: var(--primary);
        }

        button {
            margin-top: 10px;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.2s ease;
        }

        button:hover {
            background: var(--primary-dark);
        }

        .error {
            margin-bottom: 16px;
            display: none;
            color: var(--error);
            background: #fff1f0;
            border: 1px solid #f6c4c0;
            border-radius: 10px;
            padding: 10px 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Equipment Requisition Form</h2>

        <div id="error" class="error">Please complete all required fields before submitting.</div>

        <form id="requisition-form" action="/submit" method="post" novalidate>
            <div class="field">
                <label for="reg_number">Regimental Number</label>
                <input type="text" id="reg_number" name="reg_number" required placeholder="e.g. U1064596" />
            </div>

            <div class="field">
                <label for="rank">Rank</label>
                <input type="text" id="rank" name="rank" required placeholder="e.g. PTE" />
            </div>

            <div class="field">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" required />
            </div>

            <div class="field">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" required />
            </div>

            <div class="field">
                <label for="unit">Unit</label>
                <input type="text" id="unit" name="unit" required placeholder="e.g. Royal New Zealand Infantry Regiment" />
            </div>

            <div class="field">
                <label for="weapon">Weapon</label>
                <select id="weapon" name="weapon" required>
                    <option value="">Select a weapon</option>
                    <option value="Modular Assault Rifle System-Light">MARS-L</option>
                    <option value="Light Support Weapon">Light Support Weapon</option>
                    <option value="Glock 17 Gen 4">Glock 17 Gen 4</option>
                </select>
            </div>

            <div class="field">
                <label for="weapon_serial">Weapon Serial Number</label>
                <input type="text" id="weapon_serial" name="weapon_serial" required placeholder="e.g. ABC123" />
            </div>

            <button type="submit">Submit Requisition</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('requisition-form');
        const errorBox = document.getElementById('error');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            const requiredFields = form.querySelectorAll('[required]');
            let isValid = true;

            requiredFields.forEach((field) => {
                const value = field.value.trim();
                if (!value) {
                    isValid = false;
                    field.style.borderColor = '#b42318';
                } else {
                    field.style.borderColor = '#dfe6ee';
                }
            });

            if (!isValid) {
                errorBox.style.display = 'block';
                errorBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                return;
            }

            errorBox.style.display = 'none';

            const formData = new FormData(form);

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                const result = await response.json();

                if (!result || typeof result !== 'object') {
                    throw new Error('Invalid response from server.');
                }

                if (result.success) {
                    const encoded = encodeURIComponent(JSON.stringify(result));
                    window.location.href = '/results.html?data=' + encoded;
                    return;
                }

                throw new Error(result.message || 'Submission failed.');
            } catch (error) {
                errorBox.textContent = error.message || 'Something went wrong while submitting.';
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
