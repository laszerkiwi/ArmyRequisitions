<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Army Requisitions</title>
    <style>
        :root {
            --bg: #eef4ff;
            --panel: #ffffff;
            --text: #1f2937;
            --muted: #53657a;
            --primary: #1d4ed8;
            --primary-dark: #163ea8;
            --border: #dfe6ee;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff 0%, #f9fbff 100%);
            color: var(--text);
            padding: 24px;
        }

        .card {
            width: min(100%, 620px);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
            padding: 32px 28px;
            text-align: center;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(2rem, 3vw, 2.5rem);
        }

        p {
            color: var(--muted);
            line-height: 1.6;
            margin: 0 0 28px;
        }

        .button {
            display: inline-block;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            padding: 14px 22px;
            font-size: 1rem;
            font-weight: 700;
            transition: background 0.2s ease;
        }

        .button:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Army Requisitions</h1>
        <p>Issue equipment securely to a soldier and track the transaction in the requisition log.</p>
        <a href="/form" class="button">Open Requisition Form</a>
    </div>
</body>
</html>
